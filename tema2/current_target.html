<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>target vs currentTarget</h1>
    <section>
        <h1>Section</h1>
        <article>
            <h2>Article</h2>
            <div>
                <h3>Div</h3>
                <button>Button</button>
            </div>
        </article>
    </section>
    <p>Pulsa en cualquier parte de este parrafo para eliminar todo el parrafo</p>
    <script>
        document.querySelector('section').addEventListener('click', (event) => {
        console.log("Objeto que recibe el evento: ", event.target);
        console. log("Objeto que tiene el eventListener:", event.currentTarget)
        })
        document.querySelector('p').addEventListener('click',(event)=> event.currentTarget.remove())
    </script>
</body>
</html>
