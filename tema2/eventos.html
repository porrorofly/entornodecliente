    <h1>Eventos</h1>
    <h2>Tres formas de crear eventos</h2>
    <ol>
        <li>Evento en línea <button onclick="console.log('Pulsado botón 1')">Botón 1</button></li>
        <li>En la propiedad del elemento: <button id="boton2">Botón 2</button></li>
        <li>Agregando EventListener <button id="boton3">Botón3</button></li>
    </ol>
    <script>
        const boton2 = document.getElementById('boton2')
        boton2.onclick = () => console.log('pulsando botón 2')

         } */

        const boton3 = document.getElementById('boton3')
        boton3.addEventListener('click', pulsarBoton)

        function pulsarBoton() {
            console.log('Pulsado botón3')
        }
        boton3.addEventListener('click', () => console.log('nueva función en botón 3'))
    </script>
