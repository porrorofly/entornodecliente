<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Factura</title>
    <style>
       
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #005a9c;
            border-bottom: 1px solid #ddd;
            padding-bottom: 12px;
        }

        h2 {
            color: #005a9c;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
            margin-top: 30px;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #ddd;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px 12px;
        }

        thead th {
            background-color: #005a9c;
            color: white;
            text-align: left;
        }

        td {
            text-align: right;
            font-family: "Courier New", monospace;
        }

        th:first-child,
        td:first-child {
            text-align: left;
            font-family: Arial, sans-serif;
        }

        th:last-child,
        td:last-child {
            text-align: center;
        }

        tbody tr:nth-child(even) {
            background-color: #f4f4f4;
        }

        /* Ids */
        #formulario-producto {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        #insertar {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 11px 22px;
            font-weight: bold;
            cursor: pointer;
        }

        #insertar:hover {
            background-color: #0062cc;
        }

        #resumen-factura td {
            background-color: #f0f0f0;
        }

        #resumen-factura td:first-child {
            text-align: left;
            font-weight: bold;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        #resumen-factura tr:last-child td {
            background-color: #dce6f0;
            font-size: 16px;
        }

        /* Clases */
        .campo {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .grupo_impuestos {
            background-color: #f4f4f4;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }

        .grupo_impuestos label {
            font-weight: normal;
            margin: 0 10px;
            cursor: pointer;
        }

        .eliminar {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .eliminar:hover {
            background-color: #a71d2a;
        }
    </style>
</head>
<body>
    <h1>Sistema de Facturación</h1>

    <section id="entrada">
        <h2>Añadir Producto</h2>
        <form id="formulario-producto">
            <div class="campo">
                <label for="concepto">Concepto:</label>
                <input type="text" id="concepto" placeholder="Nombre del producto">
            </div>

            <div class="campo">
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" value="1" min="1" step="1">
            </div>

            <div class="campo">
                <label for="precio">Precio (€):</label>
                <input type="number" id="precio" min="0.01" step="0.01" placeholder="0.00">
            </div>

            <button type="button" id="insertar">Insertar</button>
        </form>
    </section>

    <section id="seccion_impuestos">
        <h2>Seleccionar Impuestos</h2>
        <div class="grupo_impuestos">
            <label><input type="radio" name="tasa" value="0.05"> 5%</label>
            <label><input type="radio" name="tasa" value="0.10"> 10%</label>
            <label><input type="radio" name="tasa" value="0.15"> 15%</label>
            <label><input type="radio" name="tasa" value="0.20" checked> 20%</label>
        </div>
    </section>

    <section id="tabla-factura">
        <h2>Factura</h2>
        <table id="tabla">
            <thead>
                <tr>
                    <th>Concepto</th>
                    <th>Cantidad</th>
                    <th>Precio Unit.</th>
                    <th>Precio Total</th>
                    <th>Eliminar</th>
                </tr>
            </thead>
            <tbody id="lista-productos"></tbody>
            <tfoot id="resumen-factura">
                <tr>
                    <td colspan="3">Subtotal:</td>
                    <td id="subtotal">0,00 €</td>
                    <td></td>
                </tr>
                <tr>
                    <td colspan="3">Tasa:</td>
                    <td id="tasa-texto">20%</td>
                    <td></td>
                </tr>
                <tr>
                    <td colspan="3">Impuestos:</td>
                    <td id="impuestos">0,00 €</td>
                    <td></td>
                </tr>
                <tr>
                    <td colspan="3"><strong>TOTAL:</strong></td>
                    <td><strong id="total">0,00 €</strong></td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
    </section>

    <script>
        const inputConcepto = document.getElementById("concepto");
        const inputCantidad = document.getElementById("cantidad");
        const inputPrecio = document.getElementById("precio");
        const botonInsertar = document.getElementById("insertar");
        const listaProductos = document.getElementById("lista-productos");
        const radiosTasa = document.querySelectorAll('input[name="tasa"]');

        function formatoMoneda(numero) {
            return numero.toLocaleString("es-ES", { style: "currency", currency: "EUR" });
        }

        function obtenerTasa() {
            return parseFloat(document.querySelector('input[name="tasa"]:checked').value);
        }

        function recalcularTotales() {
            let subtotal = 0;
            listaProductos.querySelectorAll("tr").forEach(function (fila) {
                subtotal += parseFloat(fila.dataset.total);
            });

            const tasa = obtenerTasa();
            const impuestos = subtotal * tasa;

            document.getElementById("subtotal").textContent = formatoMoneda(subtotal);
            document.getElementById("tasa-texto").textContent = (tasa * 100) + "%";
            document.getElementById("impuestos").textContent = formatoMoneda(impuestos);
            document.getElementById("total").textContent = formatoMoneda(subtotal + impuestos);
        }

        function insertarProducto() {
            const concepto = inputConcepto.value.trim();
            const cantidad = parseFloat(inputCantidad.value);
            const precio = parseFloat(inputPrecio.value);

            if (concepto === "" || isNaN(cantidad) || isNaN(precio) || cantidad <= 0 || precio <= 0) {
                alert("Rellena el concepto, una cantidad y un precio válidos.");
                return;
            }

            const precioTotal = cantidad * precio;

            const fila = document.createElement("tr");
            fila.dataset.total = precioTotal;
            fila.innerHTML =
                "<td></td>" +
                "<td>" + cantidad + "</td>" +
                "<td>" + formatoMoneda(precio) + "</td>" +
                "<td>" + formatoMoneda(precioTotal) + "</td>" +
                '<td><button type="button" class="eliminar">X</button></td>';
            fila.firstChild.textContent = concepto;
            listaProductos.appendChild(fila);

            inputConcepto.value = "";
            inputCantidad.value = 1;
            inputPrecio.value = "";
            inputConcepto.focus();

            recalcularTotales();
        }

        function eliminarProducto(evento) {
            if (evento.target.classList.contains("eliminar")) {
                evento.target.closest("tr").remove();
                recalcularTotales();
            }
        }

        botonInsertar.addEventListener("click", insertarProducto);
        listaProductos.addEventListener("click", eliminarProducto);
        radiosTasa.forEach(function (radio) {
            radio.addEventListener("change", recalcularTotales);
        });

        recalcularTotales();
    </script>
</body>
</html>
